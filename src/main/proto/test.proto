syntax = "proto3";

option java_package = "org.woo.auth.grpc";
option java_outer_classname = "TestProto";

service GrpcTestService {
  rpc GrpcTest (GrpcTestRequest) returns (GrpcTestResponse);
}

// 멤버 생성 요청 객체
message GrpcTestRequest {
}

// 멤버 생성 응답
message GrpcTestResponse {
  repeated TestData data = 1;
}

message TestData {
  int32 id = 1;
  string applicationName = 2;
  string clientId = 3;
  optional string clientSecret = 4;
  string provider = 5;
}